events {
	worker_connections 1024;
}

error_log  ./server_log;
http {
	server {
		listen 8080;
		server_name localhost;
		client_max_body_size 1048576;

		error_pages 404 ./test_site/errors/404.html;

		location / {
			root test_site;
			index index.html;
			autoindex on;
			methods GET;
		}

		location /upload {
			root test_site/upload;
			upload_store ./;
			methods GET POST DELETE;
			autoindex on;
		}

		location /cgi-bin {
			root test_site/cgi-bin;
			cgi_redir .py /usr/bin/python3;
			methods GET POST;
		}
	}
}
