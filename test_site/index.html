<!DOCTYPE html>
<html>
<head>
	<title>Webserv - Test Page</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<h1>Welcome to Webserv!</h1>
	<p>This is a test page served by our HTTP server.</p>
	<h2>Links:</h2>
	<ul>
		<li><a href="/cgi-bin/hello.py">CGI Test (Python)</a></li>
		<li><a href="/upload/">Upload Directory</a></li>
	</ul>
	<h2>Upload a file:</h2>
	<form action="/upload/" method="POST" enctype="multipart/form-data">
		<input type="file" name="file"><br><br>
		<input type="submit" value="Upload File">
	</form>
	<h2>Upload text:</h2>
	<form action="/upload/text_upload.txt" method="POST">
		<textarea name="content" rows="4" cols="50">Type something here</textarea><br>
		<input type="submit" value="Upload Text">
	</form>
</body>
</html>
