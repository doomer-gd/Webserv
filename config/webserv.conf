#[ debug | info | notice | warn | error | crit ]

error_log  ./webserv.error_log;

worker_rlimit_nofile		2048;

client_header_buffer_size	1k;
client_body_buffer_size		128k;

events {
	worker_connections		1024;
}

http {
	common_timeout			7;


	server {
		listen			8080;
		server_name		webserv.com www.webserv.com webs;
		client_max_body_size	10m;
		error_pages 404 ./test_site/errors/404_other.html;

		location / {
			root  ./test_site/;
			index	index.html;
			autoindex	off;
			methods GET POST DELETE;
			upload_store /download;
		}
		location /upload/ {
			root  ./test_site/;
			index	index.html;
			autoindex	off;
			methods GET POST DELETE;
			upload_store /download;
		}
		location /cgi-bin {
			root test_site/cgi-bin;
			cgi_redir .py /usr/bin/python3;
			methods GET POST;
		}
	}

	server {
		listen			8080;
		server_name		other_site;
		client_max_body_size	10m;
		error_pages 404 ./test_site/errors/404.html;

		location / {
			root  .;
			index	index.html;
			autoindex	off;
			methods GET;
			upload_store /download;
		}
	}

	server {
		listen			8081;
		server_name		one_more_site;
		client_max_body_size	10m;

		location / {
			root  .;
			index	index.html;
			autoindex	off;
			methods GET;
			upload_store /download;
		}
		location /cgi-bin {
			root ./test_site/cgi-bin;
			cgi_redir .py /usr/bin/python3;
			methods GET POST;
		}
	}
}
